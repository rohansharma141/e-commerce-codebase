name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Lint, build, and the module test suites — including the integration ones.
  #
  # Those integration suites are what prove RLS isolation, snapshot integrity,
  # promotion races and idempotency. They opt in on TEST_*_URL and skip
  # silently when it is absent, which is exactly what happened here: for
  # several commits this workflow ran without any backing services, the suites
  # skipped, two of them rotted until they no longer compiled, and CI stayed
  # green throughout. Green has to mean the platform works, not that it
  # compiles.
  #
  # Backing services come from the repo's own docker-compose.yml rather than
  # GitHub service containers, for one specific reason: the compose file mounts
  # docker/postgres/init, which creates the non-superuser `platform` role. RLS
  # only bites for a role without BYPASSRLS, so a plain `postgres` service
  # container would run the isolation tests as a superuser and pass them
  # vacuously. Reusing compose means CI and a developer's laptop exercise the
  # same setup.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: lint · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start backing services
        run: docker compose up -d --wait postgres redis opensearch

      - name: Lint, test, build
        env:
          TEST_DATABASE_URL: postgres://platform:platform@localhost:5432/platform
          TEST_REDIS_URL: redis://localhost:6379
          TEST_OPENSEARCH_URL: http://localhost:9200
          # TEST_API_URL is deliberately NOT set. The storefront conformance
          # suite needs a seeded api, and the module suites here drop the
          # catalog/pricing/orders schemas — contradictory requirements, so it
          # runs in its own job below.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm nx affected --base=origin/main -t lint test build
          else
            pnpm nx run-many -t lint test build
          fi

      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs --tail=120

  # ───────────────────────────────────────────────────────────────────────────
  # Storefront ↔ api contract conformance, against a real running api.
  #
  # Separate job because it needs the opposite of what `verify` needs: a
  # populated database rather than a disposable one. It also builds both Docker
  # images, which is the only place the Dockerfiles themselves get exercised —
  # `nx build` covers the Next.js compile but not the image.
  # ───────────────────────────────────────────────────────────────────────────
  conformance:
    name: storefront ↔ api conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and start the api
        run: docker compose up -d --wait --build api

      - name: Wait for /ready
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ready > /dev/null; then
              echo "api ready"
              exit 0
            fi
            sleep 2
          done
          echo "api never reported ready"
          docker compose logs api --tail=120
          exit 1

      - name: Seed
        run: pnpm seed

      - name: Contract conformance
        env:
          TEST_API_URL: http://localhost:3000
        run: pnpm nx test storefront

      - name: Build the storefront image
        run: docker compose build storefront

      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs --tail=120

  # ───────────────────────────────────────────────────────────────────────────
  # The toolchain still installs on a Node major newer than the one we pin.
  #
  # This exists because it did not, for a while, and nothing said so: pnpm 9
  # crashed in nx's postinstall on Node 24 with `readStream must be readable`,
  # which made a cold clone impossible for anyone on a current Node. `engines`
  # was narrowed to turn that into a readable error, and this job is what
  # stops it from silently narrowing again.
  #
  # `--config.sideEffectsCache=false` is the point of the job. Without it pnpm
  # restores built artifacts from its cache instead of running the build
  # scripts, so the install would pass without ever executing the script that
  # used to crash — green would mean the cache was warm, not that Node 24
  # works.
  # ───────────────────────────────────────────────────────────────────────────
  node-next:
    name: install on Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install, running every allowed build script
        run: pnpm install --frozen-lockfile --config.sideEffectsCache=false

      - name: Nothing was skipped
        run: |
          if pnpm install --frozen-lockfile 2>&1 | grep -q "Ignored build scripts"; then
            echo "pnpm skipped build scripts — add them to onlyBuiltDependencies"
            exit 1
          fi

      - name: Build both deployables
        run: pnpm nx run-many -t build
