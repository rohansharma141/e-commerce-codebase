apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: commerce
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: commerce-platform
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: commerce-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Long enough for in-flight requests to finish. The outbox worker's
      # timers are unref'd so they do not hold the process open, and an
      # interrupted delivery is safe: the row keeps its claim timeout and
      # becomes eligible again rather than being lost.
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          image: ghcr.io/rohansharma141/e-commerce-api:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # No CPU limit on purpose: throttling a Node event loop turns a
              # latency spike into a readiness failure and then into a restart.
              # Memory is limited because a leak should be killed, not swapped.
              memory: 1Gi

          # Three probes, and the distinction between them is the point.
          #
          # startupProbe covers first boot, which runs migrations. The runner
          # takes a Postgres advisory lock, so three replicas starting at once
          # serialise instead of racing — that race was a real bug, found on
          # the first CI run and fixed there. The generous failureThreshold is
          # for the migration, not for a slow process.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # Liveness asks only "is this process still working?" and must NOT
          # check dependencies. A readiness-style liveness probe turns a brief
          # database blip into a cluster-wide restart storm, which is strictly
          # worse than serving errors for a few seconds.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness does check dependencies, so a pod that cannot reach
          # Postgres, Redis or OpenSearch is pulled from the Service and left
          # running to recover.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        # readOnlyRootFilesystem is on, and the process still needs somewhere
        # to write.
        - name: tmp
          emptyDir: {}
