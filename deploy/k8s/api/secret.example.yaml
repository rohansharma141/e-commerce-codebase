# TEMPLATE. Do not apply, do not fill in, do not commit a filled copy.
#
# Real values come from the cluster's secret store — External Secrets Operator,
# Sealed Secrets, or the cloud provider's CSI driver. This file exists to
# document the required keys and their shapes, which is the part a deployer
# actually needs to know.
#
# STOREFRONT_REVALIDATE_SECRET is shared with the storefront, where it is named
# REVALIDATE_SECRET. Rotating it is a restart of both, in that order — the
# storefront first, so the old secret stops being accepted at the first
# restart. docs/RUNBOOK.md carries the procedure and what the gap costs.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: commerce
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: commerce-platform
type: Opaque
stringData:
  # Managed Postgres. Not in-cluster — see deploy/k8s/README.md.
  DATABASE_URL: "postgres://REPLACE_ME@postgres.example.internal:5432/platform"
  REDIS_URL: "redis://REPLACE_ME@redis.example.internal:6379"
  OPENSEARCH_URL: "https://REPLACE_ME@opensearch.example.internal:9200"
  STOREFRONT_REVALIDATE_SECRET: "REPLACE_ME"
