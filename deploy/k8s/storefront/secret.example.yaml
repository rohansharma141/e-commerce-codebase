# TEMPLATE. See deploy/k8s/api/secret.example.yaml for why this is not a real
# secret and where real values come from.
#
# REVALIDATE_SECRET must equal the api's STOREFRONT_REVALIDATE_SECRET. The two
# names differ, which is the likeliest way to get a rotation wrong.
apiVersion: v1
kind: Secret
metadata:
  name: storefront-secrets
  namespace: commerce
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: commerce-platform
type: Opaque
stringData:
  REVALIDATE_SECRET: "REPLACE_ME"
