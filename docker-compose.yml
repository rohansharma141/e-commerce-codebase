services:
  postgres:
    image: postgres:16-alpine
    # POSTGRES_USER stays as the default superuser `postgres`. The real app
    # role `platform` is created (without SUPERUSER / BYPASSRLS) by the
    # initdb script in docker/postgres/init/. This is what lets RLS bind for
    # the api's connections; see docker/postgres/init/01-platform-role.sql.
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "DevOnly_ChangeMe_123!"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'yellow|green'"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      # Storefront revalidation webhooks, pointed at the storefront service
      # on the compose network. When unset, the dispatcher logs and skips —
      # api-only deployments don't wire this at all, which is the point:
      # the api never requires a storefront to exist.
      #
      # Running the storefront on the host instead (`pnpm nx serve
      # storefront`)? Override with the Docker-Desktop bridge:
      #   STOREFRONT_REVALIDATE_URL=http://host.docker.internal:3001/api/revalidate
      STOREFRONT_REVALIDATE_URL: http://storefront:3001/api/revalidate
      STOREFRONT_REVALIDATE_SECRET: dev-revalidate-secret-change-me
      # Give up quickly and sweep often, so the dead-letter path is observable
      # in a demo rather than taking minutes. Production defaults are 6
      # attempts and a 60s sweep.
      STOREFRONT_WEBHOOK_MAX_ATTEMPTS: "2"
      STOREFRONT_OUTBOX_SWEEP_MS: "15000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      # Server-side calls to the api travel over the compose network.
      API_ORIGIN: http://api:3000
      # Must match the api's STOREFRONT_REVALIDATE_SECRET; the storefront
      # rejects revalidation POSTs that don't carry it.
      REVALIDATE_SECRET: dev-revalidate-secret-change-me
    ports:
      - "3001:3001"

volumes:
  postgres-data:
  opensearch-data:
