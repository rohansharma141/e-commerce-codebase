services:
  postgres:
    image: postgres:16-alpine
    # POSTGRES_USER stays as the default superuser `postgres`. The real app
    # role `platform` is created (without SUPERUSER / BYPASSRLS) by the
    # initdb script in docker/postgres/init/. This is what lets RLS bind for
    # the api's connections; see docker/postgres/init/01-platform-role.sql.
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "DevOnly_ChangeMe_123!"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'yellow|green'"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      # Storefront revalidation webhooks. host.docker.internal is the
      # Docker-Desktop bridge from container → host process (the storefront
      # runs on the host via `pnpm nx serve storefront`). When unset, the
      # webhook dispatcher logs and skips — api-only deployments don't need
      # this wired.
      STOREFRONT_REVALIDATE_URL: http://host.docker.internal:3001/api/revalidate
      STOREFRONT_REVALIDATE_SECRET: dev-revalidate-secret-change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  opensearch-data:
